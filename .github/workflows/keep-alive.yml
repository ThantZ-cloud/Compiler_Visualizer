name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          URL="${{ secrets.RENDER_URL }}"
          if [ -z "$URL" ]; then
            URL="https://compiler-visualizer-api.onrender.com"
          fi
          echo "Pinging $URL/api/health ..."
          curl -fsS --max-time 90 "$URL/api/health" && echo "Keep-alive ping succeeded" || (echo "Keep-alive ping failed" && exit 1)
