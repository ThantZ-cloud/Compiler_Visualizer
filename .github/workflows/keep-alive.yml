name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: curl -fsS --max-time 90 "${RENDER_URL}/api/health"
