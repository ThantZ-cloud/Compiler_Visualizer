# Production Profile - Supabase PostgreSQL
# All values come from environment variables (set them in the Render dashboard):
#   DB_URL      e.g. jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
#   DB_USERNAME e.g. postgres.<project-ref>
#   DB_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# JPA Configuration
# ddl-auto=update creates tables on first boot; consider "validate" once schema is stable
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# CORS origins are read by SecurityConfig from app.cors.allowed-origins
# Set APP_CORS_ALLOWED_ORIGINS env var on Render, e.g.:
# https://compiler-visualizer-thant-zin.vercel.app,http://localhost:5173
